<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySQL 銷售資料庫監控與即時儀表板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <style>
    .dataTables_wrapper select, .dataTables_wrapper input {
      border: 1px solid #cbd5e1;
      border-radius: 0.375rem;
      padding: 0.25rem 0.5rem;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8">
  <div class="max-w-7xl mx-auto space-y-6">
    <header class="flex flex-col md:flex-row md:items-center md:justify-between border-b border-slate-200 pb-4 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">MySQL 銷售資料庫即時監控儀表板</h1>
        <p class="text-sm text-slate-500 mt-1">
          資料來源：MySQL 資料庫快照 &bull; 查詢時間：<span id="loadTime" class="font-medium text-slate-700">載入中...</span>
        </p>
      </div>
      <div class="flex items-center gap-2">
        <span id="statusBadge" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-800">
          <span class="w-2 h-2 mr-1.5 bg-yellow-500 rounded-full animate-ping"></span> 連線中...
        </span>
      </div>
    </header>

    <!-- 指標卡片 -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="text-xs font-semibold uppercase tracking-wider text-slate-500">總記錄數</div>
        <div id="cardRecords" class="text-2xl font-bold mt-2 text-slate-900">--</div>
        <div class="text-xs text-slate-400 mt-1">基準：300 筆</div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="text-xs font-semibold uppercase tracking-wider text-slate-500">總售出數量 (含退貨)</div>
        <div id="cardQty" class="text-2xl font-bold mt-2 text-slate-900">--</div>
        <div class="text-xs text-slate-400 mt-1">原始 3,444 / 更新 4,524</div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="text-xs font-semibold uppercase tracking-wider text-slate-500">總退貨數量</div>
        <div id="cardReturns" class="text-2xl font-bold mt-2 text-rose-600">--</div>
        <div class="text-xs text-slate-400 mt-1">原始 33 / 更新 63</div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="text-xs font-semibold uppercase tracking-wider text-slate-500">淨銷售總額</div>
        <div id="cardNet" class="text-2xl font-bold mt-2 text-emerald-600">--</div>
        <div class="text-xs text-slate-400 mt-1">原始 3,217,100 / 更新 3,970,100</div>
      </div>
    </div>

    <!-- 每日折線圖 -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-bold text-slate-900 mb-4">每日淨銷售額趨勢折線圖 (2026年9月)</h2>
      <canvas id="dailyChart" height="85"></canvas>
    </div>

    <!-- 圖表格狀區 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-900 mb-4">各商品淨銷售額長條圖</h2>
        <canvas id="productChart"></canvas>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-900 mb-4">各分類淨銷售額占比圓餅圖</h2>
        <canvas id="categoryChart"></canvas>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-900 mb-4">各通路銷售額比較長條圖</h2>
        <canvas id="channelChart"></canvas>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-900 mb-4">售出數量 vs 淨銷售額散佈圖</h2>
        <canvas id="scatterChart"></canvas>
      </div>
    </div>

    <!-- 資料庫資料表格 -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-xl font-bold text-slate-900 mb-4">資料庫詳細銷售紀錄</h2>
      <div class="overflow-x-auto">
        <table id="salesTable" class="display w-full text-sm text-left">
          <thead>
            <tr class="bg-slate-100 text-slate-700">
              <th>ID</th>
              <th>日期</th>
              <th>商品名稱</th>
              <th>分類</th>
              <th>通路</th>
              <th>單價</th>
              <th>售出數量</th>
              <th>退貨數</th>
              <th>淨銷售額</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let chartInstances = {};
    let dataTableInstance = null;

    async function loadDataAndRender() {
      try {
        // 帶上時間戳記強制繞過快取，每次 F5 都抓取最新 data.json
        const res = await fetch('./data.json?t=' + new Date().getTime());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        renderPage(data);
        document.getElementById('loadTime').innerText = new Date().toLocaleString();
        document.getElementById('statusBadge').innerHTML = '<span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span> 資料庫已即時同步';
        document.getElementById('statusBadge').className = 'inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800';
      } catch (err) {
        document.getElementById('statusBadge').innerHTML = '<span class="w-2 h-2 mr-1.5 bg-rose-500 rounded-full"></span> 讀取失敗';
        document.getElementById('statusBadge').className = 'inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-rose-100 text-rose-800';
      }
    }

    function renderPage(records) {
      let totalQty = 0, totalReturns = 0, totalNet = 0;
      let dailyMap = {}, prodMap = {}, catMap = {}, channelMap = {};
      let scatterData = [];

      records.forEach(r => {
        let netQty = r.quantity - r.returned_quantity;
        let netRev = r.unit_price * netQty;
        r.net_revenue = netRev;

        totalQty += r.quantity;
        totalReturns += r.returned_quantity;
        totalNet += netRev;

        dailyMap[r.sale_date] = (dailyMap[r.sale_date] || 0) + netRev;
        prodMap[r.product_name] = (prodMap[r.product_name] || 0) + netRev;
        catMap[r.category] = (catMap[r.category] || 0) + netRev;
        channelMap[r.channel] = (channelMap[r.channel] || 0) + netRev;
        scatterData.push({ x: r.quantity, y: netRev });
      });

      document.getElementById('cardRecords').innerText = records.length + ' 筆';
      document.getElementById('cardQty').innerText = totalQty.toLocaleString() + ' 件';
      document.getElementById('cardReturns').innerText = totalReturns.toLocaleString() + ' 件';
      document.getElementById('cardNet').innerText = 'NT$ ' + totalNet.toLocaleString();

      Object.values(chartInstances).forEach(c => c.destroy());

      chartInstances.daily = new Chart(document.getElementById('dailyChart'), {
        type: 'line',
        data: {
          labels: Object.keys(dailyMap),
          datasets: [{ label: '淨銷售額 (NT$)', data: Object.values(dailyMap), borderColor: '#2563eb', backgroundColor: 'rgba(37, 99, 235, 0.08)', borderWidth: 2, fill: true, tension: 0.25 }]
        },
        options: { responsive: true }
      });

      let sortedProds = Object.entries(prodMap).sort((a,b) => b[1] - a[1]);
      chartInstances.prod = new Chart(document.getElementById('productChart'), {
        type: 'bar',
        data: {
          labels: sortedProds.map(x => x[0]),
          datasets: [{ label: '淨銷售額 (NT$)', data: sortedProds.map(x => x[1]), backgroundColor: '#3b82f6' }]
        },
        options: { indexAxis: 'y', responsive: true }
      });

      chartInstances.cat = new Chart(document.getElementById('categoryChart'), {
        type: 'pie',
        data: {
          labels: Object.keys(catMap),
          datasets: [{ data: Object.values(catMap), backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'] }]
        },
        options: { responsive: true }
      });

      chartInstances.channel = new Chart(document.getElementById('channelChart'), {
        type: 'bar',
        data: {
          labels: Object.keys(channelMap),
          datasets: [{ label: '通路銷售額 (NT$)', data: Object.values(channelMap), backgroundColor: '#10b981' }]
        },
        options: { responsive: true }
      });

      chartInstances.scatter = new Chart(document.getElementById('scatterChart'), {
        type: 'scatter',
        data: { datasets: [{ label: '單筆交易 (售出量 vs 淨額)', data: scatterData, backgroundColor: 'rgba(239, 68, 68, 0.65)' }] },
        options: {
          responsive: true,
          scales: {
            x: { title: { display: true, text: '售出數量 (件)' } },
            y: { title: { display: true, text: '淨銷售額 (NT$)' } }
          }
        }
      });

      if (dataTableInstance) {
        dataTableInstance.clear().rows.add(records).draw();
      } else {
        dataTableInstance = $('#salesTable').DataTable({
          data: records,
          pageLength: 10,
          lengthMenu: [10, 25, 50, 100],
          columns: [
            { data: 'sale_id' },
            { data: 'sale_date' },
            { data: 'product_name', render: d => '<b>' + d + '</b>' },
            { data: 'category' },
            { data: 'channel', render: d => {
                let badge = d === '網路商店' ? 'bg-blue-100 text-blue-800' : (d === '實體門市' ? 'bg-amber-100 text-amber-800' : 'bg-purple-100 text-purple-800');
                return '<span class="px-2 py-0.5 rounded text-xs ' + badge + '">' + d + '</span>';
            }},
            { data: 'unit_price', render: d => 'NT$ ' + d.toLocaleString() },
            { data: 'quantity' },
            { data: 'returned_quantity', render: d => d > 0 ? '<span class="text-rose-600 font-bold">' + d + '</span>' : '0' },
            { data: 'net_revenue', render: d => '<span class="text-emerald-600 font-semibold">NT$ ' + d.toLocaleString() + '</span>' }
          ],
          language: {
            search: "搜尋記錄：",
            lengthMenu: "每頁顯示 _MENU_ 筆",
            info: "顯示第 _START_ 至 _END_ 筆，共 _TOTAL_ 筆",
            paginate: { previous: "上一頁", next: "下一頁" },
            zeroRecords: "找不到銷售紀錄"
          }
        });
      }
    }

    $(document).ready(function() {
      loadDataAndRender();
    });
  </script>
</body>
</html>
